name: Scheduled Cron Jobs

# Railway does NOT run the crons declared in vercel.json. This workflow is the
# scheduler for production. Each job hits a /api/cron/* endpoint with the shared
# CRON_SECRET bearer token. All endpoints accept GET.
#
# NOTE on cadence: GitHub Actions scheduled runs are best-effort and the minimum
# reliable interval is ~15 min (often delayed under load). The high-frequency
# jobs (email-sync every 5 min, workflows every 15 min) are included here at a
# best-effort cadence, but for production SLAs they should run on Railway's
# native cron service instead. Daily/weekly/hourly jobs are reliable here.
#
# Schedules are in UTC. France is UTC+1 (winter) / UTC+2 (summer); the local
# target times below assume CEST (UTC+2), matching the original vercel.json.

on:
  schedule:
    - cron: '*/15 * * * *'   # high-frequency: email-sync + workflows
    - cron: '0 * * * *'      # hourly: escalation
    - cron: '0 5 * * *'      # 07:00 CEST: rappel-audiences
    - cron: '0 6 * * *'      # 08:00 CEST: deadline-alerts + deadline-email-alerts
    - cron: '0 7 * * *'      # 09:00 CEST: cost-alerts + trial-expiry
    - cron: '0 7 * * 1'      # 09:00 CEST Monday: relance-pieces
    - cron: '0 8 * * *'      # 10:00 CEST: invoice-reminders
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Optional single endpoint to trigger. Must be one of the allowlisted cron endpoints.'
        required: false
        default: ''

env:
  BASE_URL: https://memolib.space

# This workflow only makes outbound HTTP requests and does not need GITHUB_TOKEN.
permissions: {}

jobs:
  cron:
    name: Trigger scheduled cron endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Select endpoints for this schedule
        id: select
        env:
          # Keep event-controlled values out of the generated shell script.
          CRON_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -euo pipefail
          declare -a jobs=()

          if [[ -n "$MANUAL_ENDPOINT" ]]; then
            case "$MANUAL_ENDPOINT" in
              email-sync|workflows|escalation|rappel-audiences|deadline-alerts|deadline-email-alerts|cost-alerts|trial-expiry|relance-pieces|invoice-reminders)
                jobs+=("$MANUAL_ENDPOINT")
                ;;
              *)
                echo "::error::Unsupported endpoint. Choose one of the documented cron endpoints."
                exit 1
                ;;
            esac
          else
            case "$CRON_SCHEDULE" in
              '*/15 * * * *') jobs+=("email-sync" "workflows") ;;
              '0 * * * *')    jobs+=("escalation") ;;
              '0 5 * * *')    jobs+=("rappel-audiences") ;;
              '0 6 * * *')    jobs+=("deadline-alerts" "deadline-email-alerts") ;;
              '0 7 * * *')    jobs+=("cost-alerts" "trial-expiry") ;;
              '0 7 * * 1')    jobs+=("relance-pieces") ;;
              '0 8 * * *')    jobs+=("invoice-reminders") ;;
              *)              jobs+=("deadline-alerts") ;;  # manual-dispatch default
            esac
          fi

          printf 'jobs=%s\n' "${jobs[*]}" >> "$GITHUB_OUTPUT"
          printf 'Selected endpoints: %s\n' "${jobs[*]}"

      - name: Call endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOBS: ${{ steps.select.outputs.jobs }}
        run: |
          set -euo pipefail
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi

          FAIL=0
          for job in $JOBS; do
            URL="${BASE_URL}/api/cron/${job}"
            echo "Calling ${URL}"
            if ! HTTP_CODE=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request GET "$URL" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header "Content-Type: application/json"); then
              echo "::error::${job} request failed"
              FAIL=1
              continue
            fi
            echo "HTTP ${HTTP_CODE}"
            # Do not print endpoint response bodies to Actions logs.
            if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "207" ]]; then
              echo "::error::${job} returned HTTP ${HTTP_CODE}"
              FAIL=1
            else
              echo "✅ ${job} ok"
            fi
          done
          exit "$FAIL"
