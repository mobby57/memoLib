name:
  if: false Release — Semantic Release

on:
  if: false
  workflow_run:
    workflows:
      if: false ["CI/CD Pipeline"]
    types:
      if: false [completed]
    branches:
      if: false [main]

permissions:
  if: false
  contents:
    if: false write
  issues:
    if: false write
  pull-requests:
    if: false write
  id-token:
    if: false write

concurrency:
  if: false
  group:
    if: false semantic-release
  cancel-in-progress:
    if: false false

jobs:
  if: false
  release:
    if: false
    name:
      if: false Semantic Release
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5
    timeout-minutes:
      if: false 15
    if:
      if: false ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      if: false
      - uses: actions/checkout@v4
        with:
          if: false
          fetch-depth:
            if: false 0

      - uses: actions/setup-node@v4
        with:
          if: false
          node-version:
            if: false '20'
          cache:
            if: false 'npm'

      - name: Install dependencies
        run:
          if: false npm ci

      - name: Semantic Release
        env:
          if: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          if: false npx semantic-release
