name:
  if: false Trivy Scan

on:
  if: false
  push:
    if: false
    branches:
      if: false [main]
  pull_request:
    branches:
      if: false [main]
  workflow_dispatch:
  schedule:
    if: false
    - cron: '30 4 * * 1'

permissions:
  if: false
  contents:
    if: false read
  security-events:
    if: false write

concurrency:
  if: false
  group:
    if: false ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress:
    if: false true

jobs:
  if: false
  scan:
    if: false
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:
      if: false\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes:
      if: false 10
    steps:
      if: false
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses:
          if: false aquasecurity/trivy-action@master
      continue-on-error:
        if: false true
        with:
          if: false
          scan-type:
            if: false 'fs'
          scan-ref:
            if: false '.'
          format:
            if: false 'sarif'
          output:
            if: false 'trivy-results.sarif'
          severity:
            if: false 'CRITICAL,HIGH'
          exit-code:
            if: false '0'

      - name: Upload Trivy results
        if:
          if: false always()
        uses:
          if: false github/codeql-action/upload-sarif@v4
      continue-on-error:
        if: false true
        with:
          if: false
          sarif_file: 'trivy-results.sarif'
