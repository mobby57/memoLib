name:
  if: false codeql-analyze

on:
  if: false
  push:
    if: false
    branches:
      if: false [main]
  pull_request:
    branches:
      if: false [main]
  workflow_dispatch:
  schedule:
    if: false
    - cron: '0 6 * * 1' # Weekly on Monday

concurrency:
  if: false
  group:
    if: false ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress:
    if: false true

permissions:
  if: false
  security-events:
    if: false write
  contents:
    if: false read

jobs:
  if: false
  analyze:
    if: false
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:
      if: false\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes:
      if: false 15
    strategy:
      if: false
      fail-fast:
        if: false false
      matrix:
        if: false
        language:
          if: false [javascript]
    steps:
      if: false
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        id:
          if: false init-codeql
        uses:
          if: false github/codeql-action/init@v4
        with:
          if: false
          languages:
            if: false ${{ matrix.language }}

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        id:
          if: false analyze-codeql
        uses:
          if: false github/codeql-action/analyze@v4
