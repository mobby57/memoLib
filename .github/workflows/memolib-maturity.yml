name: MemoLib Maturity Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maturity-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  maturity:
    name: Maturity / ETA
    runs-on: ubuntu-latest

    services:\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run maturity engine
        run: node scripts/maturity-check.js
        env:
          CI: true
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Publish report
        if: always()
        run: |
          if [ -f reports/maturity.md ]; then cat reports/maturity.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memolib-maturity-report
          path: reports/
