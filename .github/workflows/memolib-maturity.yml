name: MemoLib Maturity Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maturity-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  maturity:
    name: Maturity / ETA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps nodemailer@7.0.7

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run maturity engine
        run: node scripts/maturity-check.js
        env:
          CI: true
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Run business validation (axe métier)
        if: always()
        run: node scripts/business-validation/run-business-validation.js
        env:
          CI: true

      - name: Publish report
        if: always()
        run: |
          if [ -f reports/maturity.md ]; then cat reports/maturity.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f reports/business-validation.md ]; then echo "" >> "$GITHUB_STEP_SUMMARY"; cat reports/business-validation.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memolib-maturity-report
          path: reports/