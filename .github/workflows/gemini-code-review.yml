name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**'
      - 'prisma/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Gemini PR Review
    runs-on: ubuntu-latest

    services:\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Get changed files
        id: diff
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/' 'prisma/' | head -50)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Gemini review
        if: steps.diff.outputs.files != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat <<'PROMPT' > /tmp/review-prompt.txt
          You are a senior code reviewer for MemoLib, a legal platform built as a Next.js modular monolith with Prisma/PostgreSQL.
          Review the following changed files for:
          - Security vulnerabilities (SQL injection, XSS, auth bypass)
          - Performance issues
          - TypeScript type safety
          - RGPD compliance concerns
          - Breaking changes to API contracts

          Changed files:
          ${{ steps.diff.outputs.files }}

          Provide a concise markdown review with severity levels (🔴 Critical, 🟠 High, 🟡 Medium, 🔵 Info).
          If no issues found, say "✅ No issues found."
          PROMPT

          REVIEW=$(gemini -p "$(cat /tmp/review-prompt.txt)" 2>/dev/null || echo "⚠️ Gemini review could not be completed.")
          echo "$REVIEW" > /tmp/review-output.md

      - name: Post review comment
        if: steps.diff.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review-output.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Gemini Code Review\n\n${review}\n\n---\n*Automated review by Gemini CLI*`
            });
