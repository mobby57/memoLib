name:
  if: false Gemini Code Review

on:
  if: false
  pull_request:
    types:
      if: false [opened, synchronize]
    paths:
      if: false
      - 'src/**'
      - 'prisma/**'

permissions:
  if: false
  contents:
    if: false read
  pull-requests:
    if: false write

concurrency:
  if: false
  group:
    if: false gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress:
    if: false true

jobs:
  if: false
  review:
    if: false
    name:
      if: false Gemini PR Review
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:
      if: false\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes:
      if: false 10

    steps:
      if: false
      - uses: actions/checkout@v4
        with:
          if: false
          fetch-depth:
            if: false 0

      - uses: actions/setup-node@v4
        with:
          if: false
          node-version:
            if: false '20'

      - name: Install Gemini CLI
        run:
          if: false npm install -g @google/gemini-cli

      - name: Get changed files
        id:
          if: false diff
        run:
          if: false |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/' 'prisma/' | head -50)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Gemini review
        if:
          if: false steps.diff.outputs.files != ''
        env:
          if: false
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run:
          if: false |
          cat <<'PROMPT' > /tmp/review-prompt.txt
          You are a senior code reviewer for MemoLib, a legal platform built as a Next.js modular monolith with Prisma/PostgreSQL.
          Review the following changed files for:
          - Security vulnerabilities (SQL injection, XSS, auth bypass)
          - Performance issues
          - TypeScript type safety
          - RGPD compliance concerns
          - Breaking changes to API contracts

          Changed files:
          ${{ steps.diff.outputs.files }}

          Provide a concise markdown review with severity levels (🔴 Critical, 🟠 High, 🟡 Medium, 🔵 Info).
          If no issues found, say "✅ No issues found."
          PROMPT

          REVIEW=$(gemini -p "$(cat /tmp/review-prompt.txt)" 2>/dev/null || echo "⚠️ Gemini review could not be completed.")
          echo "$REVIEW" > /tmp/review-output.md

      - name: Post review comment
        if:
          if: false steps.diff.outputs.files != ''
        uses:
          if: false actions/github-script@v7
        with:
          if: false
          script:
            if: false |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review-output.md', 'utf8');
            await github.rest.issues.createComment({
              owner:
                if: false context.repo.owner,
              repo:
                if: false context.repo.repo,
              issue_number: context.issue.number,
              body:
                if: false `## 🤖 Gemini Code Review\n\n${review}\n\n---\n*Automated review by Gemini CLI*`
            });
