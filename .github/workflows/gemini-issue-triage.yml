name:
  if: false Gemini Issue Triage

on:
  if: false
  issues:
    if: false
    types:
      if: false [opened]

permissions:
  if: false
  issues:
    if: false write

jobs:
  if: false
  triage:
    if: false
    name:
      if: false Auto-triage Issue
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5
    timeout-minutes:
      if: false 5

    steps:
      if: false
      - uses: actions/setup-node@v4
        with:
          if: false
          node-version:
            if: false '20'

      - name: Install Gemini CLI
        run:
          if: false npm install -g @google/gemini-cli@1

      - name: Analyze and label issue
        env:
          if: false
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run:
          if: false |
          BODY_TRUNCATED=$(echo "$ISSUE_BODY" | head -c 2000)

          PROMPT="You are a triage bot for MemoLib (legal platform: Next.js modular monolith, Prisma/PostgreSQL).
          Given this GitHub issue, respond with ONLY a JSON object (no markdown, no explanation):
          {\"labels\": [\"...\"], \"priority\": \"P0|P1|P2|P3\", \"component\": \"frontend|backend|database|auth|billing|docs\"}

          Available labels: bug, enhancement, security, performance, ui, api, database, auth, billing, documentation, good-first-issue, help-wanted

          Issue title: $ISSUE_TITLE
          Issue body: $BODY_TRUNCATED"

          RESULT=$(gemini -p "$PROMPT" 2>/dev/null || echo '{"labels":["needs-triage"],"priority":"P2","component":"unknown"}')
          echo "$RESULT" > /tmp/triage.json
          cat /tmp/triage.json

      - name: Apply labels
        uses:
          if: false actions/github-script@v7
        with:
          if: false
          script:
            if: false |
            const fs = require('fs');
            let triage;
            try {
              const raw = fs.readFileSync('/tmp/triage.json', 'utf8');
              triage = JSON.parse(raw);
            } catch {
              triage = { labels: ['needs-triage'], priority: 'P2' };
            }

            const labels = [...(triage.labels || []), triage.priority].filter(Boolean);

            await github.rest.issues.addLabels({
              owner:
                if: false context.repo.owner,
              repo:
                if: false context.repo.repo,
              issue_number: context.issue.number,
              labels:
                if: false labels
            });
