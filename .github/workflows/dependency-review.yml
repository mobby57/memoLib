name: Dependency Review

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'requirements*.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    services:\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
      continue-on-error: true
        with:
          # Block PRs that introduce HIGH or CRITICAL vulnerabilities
          fail-on-severity: high
          # Allow GPL-compatible licenses only (legal platform constraint)
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # Comment on the PR with a summary
          comment-summary-in-pr: always
          # Warn on packages with no license
          warn-on-openssf-scorecard-level: 3

      - name: npm audit (informational)
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
