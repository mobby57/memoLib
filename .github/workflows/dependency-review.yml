name: Dependency Review

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'requirements*.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs that introduce HIGH or CRITICAL vulnerabilities
          fail-on-severity: high
          # Allow GPL-compatible licenses only (legal platform constraint)
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # Comment on the PR with a summary
          comment-summary-in-pr: always
          # Warn on packages with no license
          warn-on-openssf-scorecard-level: 3

      - name: npm audit (informational)
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
