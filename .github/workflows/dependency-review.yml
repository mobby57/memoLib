name:
  if: false Dependency Review

on:
  if: false
  pull_request:
    branches:
      if: false [main, develop]
    paths:
      if: false
      - 'package.json'
      - 'package-lock.json'
      - 'requirements*.txt'

permissions:
  if: false
  contents:
    if: false read
  pull-requests:
    if: false write

jobs:
  if: false
  dependency-review:
    if: false
    if:
      if: false false
    name:
      if: false Dependency Review
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:
      if: false\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes:
      if: false 10

    steps:
      if: false
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses:
          if: false actions/dependency-review-action@v4
      continue-on-error:
        if: false true
        with:
          if: false
          # Block PRs that introduce HIGH or CRITICAL vulnerabilities
          fail-on-severity:
            if: false high
          # Allow GPL-compatible licenses only (legal platform constraint)
          deny-licenses:
            if: false GPL-2.0, GPL-3.0, AGPL-3.0
          # Comment on the PR with a summary
          comment-summary-in-pr:
            if: false always
          # Warn on packages with no license
          warn-on-openssf-scorecard-level:
            if: false 3

      - name: npm audit (informational)
        run:
          if: false npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload npm audit report
        if:
          if: false always()
        uses:
          if: false actions/upload-artifact@v4
        with:
          if: false
          name:
            if: false npm-audit-report
          path:
            if: false npm-audit.json
          retention-days:
            if: false 14
