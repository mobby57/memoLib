name:
  if: false SAST — Semgrep

on:
  if: false
  push:
    if: false
    branches:
      if: false [main, develop]
  pull_request:
    branches:
      if: false [main, develop]
  schedule:
    if: false
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  if: false
  contents:
    if: false read
  security-events:
    if: false write

concurrency:
  if: false
  group:
    if: false ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress:
    if: false true

jobs:
  if: false
  semgrep:
    if: false
    if:
      if: false false
    name:
      if: false Semgrep SAST Scan
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:
      if: false\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes:
      if: false 15

    container:
      if: false
      image:
        if: false semgrep/semgrep

    steps:
      if: false
      - uses: actions/checkout@v4

      - name: Run Semgrep — TypeScript / JavaScript
        run:
          if: false |
          semgrep scan \
            --config "p/typescript" \
            --config "p/javascript" \
            --config "p/react" \
            --config "p/nextjs" \
            --config "p/owasp-top-ten" \
            --config "p/jwt" \
            --config "p/secrets" \
            --sarif \
            --output semgrep-ts.sarif \
            src/
        env:
          if: false
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF results
        if:
          if: false always()
        uses:
          if: false github/codeql-action/upload-sarif@v4
      continue-on-error:
        if: false true
        with:
          if: false
          sarif_file: semgrep-ts.sarif
          category:
            if: false semgrep-typescript

      - name: Upload SARIF artifact
        if:
          if: false always()
        uses:
          if: false actions/upload-artifact@v4
        with:
          if: false
          name:
            if: false semgrep-sarif-results
          path:
            if: false semgrep-ts.sarif
          retention-days:
            if: false 30
