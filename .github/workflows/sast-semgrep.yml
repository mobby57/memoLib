name: SAST — Semgrep

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: semgrep/semgrep

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep — TypeScript / JavaScript
        run: |
          semgrep scan \
            --config "p/typescript" \
            --config "p/javascript" \
            --config "p/react" \
            --config "p/nextjs" \
            --config "p/owasp-top-ten" \
            --config "p/jwt" \
            --config "p/secrets" \
            --sarif \
            --output semgrep-ts.sarif \
            src/
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-ts.sarif
          category: semgrep-typescript

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-results
          path: semgrep-ts.sarif
          retention-days: 30