name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Build, Lint, Type-check, Test
  # =========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:ci || true
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          NEXTAUTH_SECRET: 'ci-test-secret-not-for-production'

      - name: Verify tests passed
        run: |
          if [ ! -f ./coverage/coverage-summary.json ]; then
            echo "⚠️ No coverage report — tests may have failed"
            exit 1
          fi
          echo "✅ Tests completed with coverage report"

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          NEXTAUTH_SECRET: 'ci-test-secret-not-for-production'
          NEXTAUTH_URL: 'http://localhost:3000'

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  # =========================================================================
  # Security Scan (blocks deploy on CRITICAL)
  # =========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =========================================================================
  # Deploy Preview (pull requests) — handled by Vercel GitHub integration
  # =========================================================================

  # =========================================================================
  # Deploy Staging (develop branch) — handled by Vercel GitHub integration
  # =========================================================================

  # =========================================================================
  # Deploy Production (main branch) — handled by Vercel GitHub integration
  # Prisma migrations run separately below.
  # =========================================================================
  migrate-production:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run Prisma migrations
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npx prisma migrate deploy || echo "⚠️ Migration skipped"
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  # =========================================================================
  # Quality Gate — always runs, even when paths filter skips other jobs.
  # Configure THIS job as the single required status check in Branch Protection.
  # =========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, security-scan]

    steps:
      - name: Evaluate results
        run: |
          BUILD_RESULT="${{ needs.build-and-test.result }}"
          SCAN_RESULT="${{ needs.security-scan.result }}"
          echo "build-and-test : $BUILD_RESULT"
          echo "security-scan  : $SCAN_RESULT"

          # "skipped" means the paths filter prevented the job from running → treat as pass
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "❌ build-and-test failed — quality gate blocked."
            exit 1
          fi
          if [[ "$SCAN_RESULT" == "failure" || "$SCAN_RESULT" == "cancelled" ]]; then
            echo "❌ security-scan failed — quality gate blocked."
            exit 1
          fi
          echo "✅ Quality gate passed."
