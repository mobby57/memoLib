name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - 'railway.toml'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - 'railway.toml'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:ci
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_test_ci'
          CLERK_SECRET_KEY: 'sk_test_ci'
      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_test_ci'
          CLERK_SECRET_KEY: 'sk_test_ci'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --file docker/Dockerfile.frontend --target runner --tag memolib:ci .
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_USER: memolib
          POSTGRES_PASSWORD: ci-test-password
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          NEXT_PUBLIC_APP_URL: https://example.test
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-nextauth-secret
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-test-token

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, docker-build, security-scan]
    steps:
      - name: Evaluate results
        run: |
          BUILD_RESULT="${{ needs.build-and-test.result }}"
          DOCKER_RESULT="${{ needs.docker-build.result }}"
          SCAN_RESULT="${{ needs.security-scan.result }}"
          echo "build-and-test : $BUILD_RESULT"
          echo "docker-build   : $DOCKER_RESULT"
          echo "security-scan  : $SCAN_RESULT"
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then exit 1; fi
          if [[ "$DOCKER_RESULT" == "failure" || "$DOCKER_RESULT" == "cancelled" ]]; then exit 1; fi
          if [[ "$SCAN_RESULT" == "failure" || "$SCAN_RESULT" == "cancelled" ]]; then exit 1; fi
          echo "✅ Quality gate passed. Railway is responsible for production migration/deployment."
