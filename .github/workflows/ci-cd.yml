name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps nodemailer@7.0.7

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Verify coverage report
        run: test -f ./coverage/coverage-summary.json

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --file docker/Dockerfile.frontend --target runner --tag memolib:ci .

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_USER: memolib
          POSTGRES_PASSWORD: ci-test-password
          NEXTAUTH_URL: https://example.test
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-test-token

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  migrate-production:
    name: Run Migrations (Production)
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run Prisma migrations
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm install --no-save --legacy-peer-deps nodemailer@7.0.7
          npx prisma generate
          npx prisma migrate resolve --applied 20260323090000_add_email_ingestion_fields || true
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  smoke-test:
    name: Smoke Test (Production)
    runs-on: ubuntu-latest
    needs: [migrate-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    env:
      PROD_URL: ${{ vars.PRODUCTION_URL || 'https://memolib.space' }}

    steps:
      - name: Wait for Render deploy
        run: sleep 60

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PROD_URL")
          echo "Production health status: $STATUS"
          test "$STATUS" -ge 200 -a "$STATUS" -lt 500