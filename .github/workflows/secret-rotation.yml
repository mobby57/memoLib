name: Secret Rotation Audit

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no changes)'
        type: boolean
        default: true
      max_age_days:
        description: 'Max secret age in days before rotation'
        type: number
        default: 90

permissions:
  contents: read
  issues: write

jobs:
  secret-rotation-audit:
    name: Secret Rotation Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run secret rotation audit (dry-run)
        id: audit
        run: |
          node scripts/rotate-secrets.js \
            --dry-run \
            --max-age-days ${{ inputs.max_age_days || 90 }} \
            2>&1 | tee rotation-audit.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: secret-rotation-audit
          path: rotation-audit.txt
          retention-days: 30

      - name: Create issue if rotation needed
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('rotation-audit.txt', 'utf8');

            const title = '🔑 Secret Rotation Required';
            const body = `## Secret Rotation Audit\n\nThe automated secret rotation audit detected secrets that need rotation.\n\n\`\`\`\n${report}\n\`\`\`\n\n**Action required:** Rotate the listed secrets and run:\n\`\`\`bash\nnode scripts/rotate-secrets.js --mark-rotated <KEY>\n\`\`\`\n\n_Generated by Secret Rotation Audit workflow on ${new Date().toISOString()}_`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,secret-rotation',
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'secret-rotation'],
              });
              console.log('Created rotation issue');
            } else {
              console.log('Rotation issue already open, skipping creation');
            }
