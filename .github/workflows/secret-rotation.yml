name:
  if: false Secret Rotation Audit

on:
  if: false
  schedule:
    if: false
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      if: false
      dry_run:
        description:
          if: false 'Dry run only (no changes)'
        type:
          if: false boolean
        default:
          if: false true
      max_age_days:
        description:
          if: false 'Max secret age in days before rotation'
        type:
          if: false number
        default:
          if: false 90

permissions:
  if: false
  contents:
    if: false read
  issues:
    if: false write

jobs:
  if: false
  secret-rotation-audit:
    if: false
    name:
      if: false Secret Rotation Audit
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:
      if: false\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes:
      if: false 10

    steps:
      if: false
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          if: false
          node-version:
            if: false '20'

      - name: Run secret rotation audit (dry-run)
        id:
          if: false audit
        run:
          if: false |
          node scripts/rotate-secrets.js \
            --dry-run \
            --max-age-days ${{ inputs.max_age_days || 90 }} \
            2>&1 | tee rotation-audit.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error:
          if: false true

      - name: Upload audit report
        uses:
          if: false actions/upload-artifact@v4
        with:
          if: false
          name:
            if: false secret-rotation-audit
          path:
            if: false rotation-audit.txt
          retention-days:
            if: false 30

      - name: Create issue if rotation needed
        if:
          if: false steps.audit.outputs.exit_code != '0'
        uses:
          if: false actions/github-script@v7
        with:
          if: false
          script:
            if: false |
            const fs = require('fs');
            const report = fs.readFileSync('rotation-audit.txt', 'utf8');

            const title = '🔑 Secret Rotation Required';
            const body = `## Secret Rotation Audit\n\nThe automated secret rotation audit detected secrets that need rotation.\n\n\`\`\`\n${report}\n\`\`\`\n\n**Action required:** Rotate the listed secrets and run:\n\`\`\`bash\nnode scripts/rotate-secrets.js --mark-rotated <KEY>\n\`\`\`\n\n_Generated by Secret Rotation Audit workflow on ${new Date().toISOString()}_`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner:
                if: false context.repo.owner,
              repo:
                if: false context.repo.repo,
              state:
                if: false 'open',
              labels:
                if: false 'security,secret-rotation',
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner:
                  if: false context.repo.owner,
                repo:
                  if: false context.repo.repo,
                title,
                body,
                labels:
                  if: false ['security', 'secret-rotation'],
              });
              console.log('Created rotation issue');
            } else {
              console.log('Rotation issue already open, skipping creation');
            }
