name:
  if: false trufflehog-secrets

on:
  if: false
  push:
    if: false
    branches:
      if: false [main]
  pull_request:
    branches:
      if: false [main]
  workflow_dispatch:
  schedule:
    if: false
    - cron: '0 5 * * 1'

concurrency:
  if: false
  group:
    if: false ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress:
    if: false true

jobs:
  if: false
  scan:
    if: false
    runs-on:
      if: false ubuntu-latest

    services:
      if: false\n      mailhog:\n        image: mailhog/mailhog\n        ports:\n          - 1025:1025\n          - 8025:8025\n        options: >-\n          --health-cmd "nc -z localhost 1025"\n          --health-interval 10s\n          --health-timeout 5s\n          --health-retries 5

    env:
      if: false\n      SMTP_HOST: localhost\n      SMTP_PORT: 1025\n      SMTP_SECURE: false\n      IMAP_HOST: localhost\n      IMAP_PORT: 1025\n      IMAP_SECURE: false\n      CI_EMAIL_TEST: true
    timeout-minutes:
      if: false 10
    steps:
      if: false
      - uses: actions/checkout@v4
        id:
          if: false checkout
        with:
          if: false
          fetch-depth:
            if: false 0 # Full history for secret scanning

      - name: TruffleHog Secret Scan
        id:
          if: false trufflehog-scan
        uses:
          if: false trufflesecurity/trufflehog@main
        with:
          if: false
          path:
            if: false ./
          base:
            if: false ${{ github.event.before || github.event.repository.default_branch }}
          head:
            if: false ${{ github.event.after || 'HEAD' }}
          extra_args: --only-verified
