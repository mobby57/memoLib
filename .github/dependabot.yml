version: 2
updates:
  # Mise à jour des dépendances npm (sécurité + versions)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "mobby57"
    labels:
      - "dependencies"
      - "security"
    # Ne pas auto-merger les mises à jour majeures (breaking changes)
    versioning-strategy: "increase"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Mise à jour des GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci/cd"
