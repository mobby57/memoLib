services:
  memolib-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memolib}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks:
      - internal

  vault-permissions:
    image: alpine:3.21
    command: ['sh', '-c', 'mkdir -p /vault && chown 1001:1001 /vault && chmod 0770 /vault']
    volumes:
      - client-vault:/vault
    restart: 'no'

  memolib:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@memolib-db:5432/${POSTGRES_DB:-memolib}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?Set UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?Set UPSTASH_REDIS_REST_TOKEN}
      VAULT_STORAGE_ROOT: /var/lib/memolib/client-vault
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - client-vault:/var/lib/memolib/client-vault
    ports:
      - '3000:3000'
    depends_on:
      memolib-db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      vault-permissions:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal

volumes:
  clamav-data:
  client-vault:
  postgres-data:

networks:
  internal:
    internal: true
